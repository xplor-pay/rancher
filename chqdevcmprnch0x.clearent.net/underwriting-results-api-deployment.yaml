apiVersion: apps/v1
kind: Deployment
metadata:
  name: underwriting-results-api
  namespace: class-a
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: underwriting-results-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: underwriting-results-api
    spec:
      containers:
      - env:
        - name: KRB5_CLIENT_KTNAME
          value: /app/keys/sqlauth.keytab
        - name: KRB5_CONFIG
          value: /app/keys/krb5.conf
        image: ${REGISTRY_NAME}/settlement/underwriting-results-api:${BUILD_BUILDNUMBER}
        name: underwriting-results-api
        livenessProbe:
          failureThreshold: 3
          httpGet:
            httpHeaders:
            - name: Host
              value: underwriting-results-api
            path: /health
            port: 80
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 2
        readinessProbe:
          failureThreshold: 3
          httpGet:
            httpHeaders:
            - name: Host
              value: underwriting-results-api
            path: /health
            port: 80
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 2
          successThreshold: 2
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 1500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 128Mi
        volumeMounts:
        - mountPath: /app/config
          name: configs
        - mountPath: /app/keys
          name: keys
      imagePullSecrets:
        - name: azurecr
      restartPolicy: Always
      volumes:
      - configMap:
          defaultMode: 256
          name: configs
          optional: false
        name: configs
      - name: keys
        secret:
          defaultMode: 256
          optional: false
          secretName: keys
