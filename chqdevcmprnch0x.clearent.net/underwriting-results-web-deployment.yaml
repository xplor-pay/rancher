apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    cattle.io/creator: norman
    workload.user.cattle.io/workloadselector: deployment-class-a-underwriting-results-web
  name: underwriting-results-web
  namespace: class-a
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: deployment-class-a-underwriting-results-web
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        workload.user.cattle.io/workloadselector: deployment-class-a-underwriting-results-web
    spec:
      containers:
      - env:
        - name: KRB5_CLIENT_KTNAME
          value: /app/keys/sqlauth.keytab
        - name: KRB5_CONFIG
          value: /app/keys/krb5.conf
        image: cladocreg01.clearent.net/settlement/underwriting-results-web:20191210.16.43.54-T31719-UseNginxAlpine
        name: underwriting-results-web
        resources: {}
        volumeMounts:
        - mountPath: /usr/share/nginx/html/underwritingwebapp/assets/data/UnderwritingResultsClientConfig.json
          name: config
      imagePullSecrets:
        - name: harbor
      restartPolicy: Always
      volumes:
      - name: config
        hostPath:
          path: /opt/docker/config/DEV/UnderwritingResultsClientConfig.json
status: {}
